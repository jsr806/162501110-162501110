<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>校园失物招领</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>校园失物招领平台</h1>
        <div class="search-bar">
            <input id="searchInput" placeholder="输入物品名称搜索">
            <select id="typeSelect">
                <option value="all">全部</option>
                <option value="lost">寻物</option>
                <option value="found">招领</option>
            </select>
        </div>
        <button id="addBtn">发布信息</button>
        <div id="listWrap" class="card-wrap"></div>
    </div>

    <!-- 发布弹窗 -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3>发布信息</h3>
            <select id="itemType">
                <option value="lost">寻物</option>
                <option value="found">招领</option>
            </select>
            <input id="itemName" placeholder="物品名称">
            <input id="itemContact" placeholder="联系方式">
            <textarea id="itemDesc" placeholder="物品描述"></textarea>
            <button id="submitBtn">提交</button>
            <button id="closeBtn">关闭</button>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <h3>物品详情</h3>
            <div id="detailBody"></div>
            <button id="statusRecover">标记已找回/归还</button>
            <button id="closeDetail">关闭</button>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="core.js"></script>
    <script src="app.js"></script>
</body>
</html>
